name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Check the custom domain file
        run: test "$(tr -d '[:space:]' < site/CNAME)" = "tamueats.us"
      - name: Upload the site directory
        uses: actions/upload-pages-artifact@v3
        with:
          # The artifact root is the contents of site/, including CNAME,
          # so GitHub Pages serves tamueats.us from the domain root.
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
